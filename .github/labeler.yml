# Paths that should receive the `ui` label (triggers / filters UI review automation).
ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*.svelte'
          - 'src/**/*.css'
          - 'src/app.html'
          - 'src/app.css'
          - 'src/routes/**'
          - 'src/lib/shell/**'
          - 'src/lib/city/**'
          - 'src/lib/map/**'
          - 'src/lib/intel/**'
          - 'src/lib/places/**'
          - 'src/lib/parking/**'
          - 'static/**'
          - 'tests/**'
          - 'playwright.config.*'
          - '.cursor/automations/**'
